<!-- SECTOR 2 · POR QUÉ EXISTE                                              -->

<!-- criterios (términos + comunidad + bloque + tema) y lanza el buscador   -->
<!-- ya filtrado, sin que el usuario tenga que escribir nada.               -->

<!-- ════════════════════════════════════════════════════════════════════════ -->
<!--   · q         → términos de búsqueda (admite | y "frase")              -->
<!--   · comunidad → comunidad autónoma (o vacío para todas)                -->
<!--   · bloque    → bloque                                                 -->
<!--   · tema      → tema                                                   -->
<!--   · fuente    → etiqueta informativa (p. ej. «TemaA1»)                 -->

<!-- ════════════════════════════════════════════════════════════════════════ -->

<!--   2. Cambiar SOLO el objeto CRITERIOS del <script> final.              -->
<!--   3. El resto (URL, redirección, fallback) es automático.              -->

<!-- SECTOR 5 · DESTINO                                                     -->
<!-- ════════════════════════════════════════════════════════════════════════ -->

<!-- SECTOR 7 · COMPORTAMIENTO ANTE FALLOS                                  -->
<!-- ════════════════════════════════════════════════════════════════════════ -->
<!--   · Si la redirección no ocurre, se muestra un enlace de respaldo.     -->
<!--   · Si todos los candidatos de ruta fallan, se muestra UNA caja de     -->
<!--     error con las rutas probadas (no antes: no hay «loading» visible   -->

<!-- SECTOR 8 · DISEÑO ANTI-PARPADEO                                        -->
<!-- ════════════════════════════════════════════════════════════════════════ -->
<!--   · Fondo = mismo que el destino (#f5f7fb) → sin flash de color.       -->
<!--   · Sin spinner ni animaciones continuas.                              -->
<!--   · Sin retardo artificial.                                            -->
<!--   · <link rel="prefetch"> del destino → el navegador lo va cacheando.  -->
<!--   · Fade-out muy breve (~120 ms) antes de navegar (opcional).          -->
<!--   · Fallback visible solo si todo falla.                               -->

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema B8 · EBAU Física</title>

<!-- El navegador empieza a traer el destino mientras ejecutamos el JS -->
<link rel="prefetch" href="../EBAU/problemas-inline v04-Filtro prefijado.html">
<link rel="prefetch" href="../EBAU/problemas-inline-v04-Filtro-prefijado.html">

<style>
  html, body {
    margin:0; padding:0; min-height:100%;
    /* MISMO color que la página destino → el flash de navegación no se nota */
    background:#f5f7fb;
    color:#1e293b;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body { opacity:1; transition: opacity .12s linear; }
  body.saliendo { opacity:0; }

  .error-box {
    max-width:600px; margin:60px auto; padding:20px 24px;
    background:#fff; border:1px solid #fecaca; border-radius:12px;
    color:#b91c1c; font-size:.88rem; line-height:1.55;
    box-shadow:0 4px 20px -8px rgba(15,23,42,.12);
  }
  .error-box strong { display:block; margin-bottom:8px; }
  .error-box ul { margin:8px 0 0; padding-left:22px; }
  .error-box li { margin:3px 0; }
  .error-box code {
    background:#fee2e2; padding:1px 6px; border-radius:4px;
    font-size:.8rem; word-break:break-all;
  }
</style>
</head>
<body>

<div id="error-container"></div>

<script>
(function () {
  'use strict';

  /* ── Criterios del Tema A1 (cámbialos para otros temas) ── */
  var CRITERIOS = {
    q:         '"líneas de campo" | "campo eléctrico" | "campo magnético" | "representación gráfica" | "densidad de líneas" | "dibujar líneas de campo" | "carga puntual" | "hilo recto" | "campo uniforme" | "esquema vectorial"',
    comunidad: 'Castilla y León',
    bloque:    'B. Campo electromagnético',
    tema:      'B8. Líneas de campo eléctrico y magnético en distribuciones sencillas'
  };

  /* ── Candidatos en orden de preferencia ── */
  var CANDIDATOS = [
    '../EBAU/problemas-inline v04-Filtro prefijado.html',
    '../EBAU/problemas-inline-v04-Filtro-prefijado.html',
    'problemas-inline v04-Filtro prefijado.html',
    'problemas-inline-v04-Filtro-prefijado.html'
  ];

  /* ── Query string ── */
  var params = new URLSearchParams();
  params.set('q',         CRITERIOS.q);
  params.set('comunidad', CRITERIOS.comunidad);
  params.set('bloque',    CRITERIOS.bloque);
  params.set('tema',      CRITERIOS.tema);
  params.set('fuente',    'TemaA1');
  var query = params.toString();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }

  function mostrarError(probadas) {
    document.getElementById('error-container').innerHTML =
      '<div class="error-box">' +
        '<strong>⚠️ No se ha encontrado el archivo del buscador.</strong>' +
        'He probado estas rutas (todas devuelven 404):' +
        '<ul>' + probadas.map(function (p) {
          return '<li><code>' + escapeHtml(p) + '</code></li>';
        }).join('') + '</ul>' +
        'Comprueba que existe <code>raíz/EBAU/problemas-inline v04-Filtro prefijado.html</code> ' +
        'y que el nombre coincide exactamente (mayúsculas, espacios, acentos, guiones…).' +
      '</div>';
  }

  /* ── Navegación inmediata, sin retardo ── */
  function ir(destino) {
    document.body.classList.add('saliendo');
    // 120 ms de fade-out sutil; si prefieres 0 ms, quita el setTimeout
    setTimeout(function () { window.location.replace(destino); }, 120);
  }

  function probar(i) {
    if (i >= CANDIDATOS.length) { mostrarError(CANDIDATOS); return; }

    fetch(CANDIDATOS[i], { method: 'HEAD', cache: 'no-store' })
      .then(function (r) {
        if (r.ok) {
          ir(CANDIDATOS[i] + '?' + query);
        } else {
          probar(i + 1);
        }
      })
      .catch(function () { probar(i + 1); });
  }

  // Arranca la comprobación al cargar el DOM (muy rápido: fetch HEAD)
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { probar(0); });
  } else {
    probar(0);
  }
})();
</script>
</body>
</html>
